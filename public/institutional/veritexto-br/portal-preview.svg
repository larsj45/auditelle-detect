      <rect x="440" y="340" width="90" height="10" rx="3" fill="#475569"/>
      <rect x="580" y="340" width="70" height="10" rx="3" fill="#475569"/>
      <rect x="700" y="336" width="36" height="18" rx="9" fill="#DCFCE7"/>

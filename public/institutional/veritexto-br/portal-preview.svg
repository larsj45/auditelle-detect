<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">VeriTexto — preview do portal institucional</title>
  <desc id="desc">Mockup neutro representando a tela de histórico do portal institucional com tabela de análises recentes, filtros e navegação lateral.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#2A4A6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="40" width="880" height="520" rx="16" fill="#FFFFFF"/>
  </g>

  <rect x="40" y="40" width="220" height="520" rx="16" fill="url(#sidebar)"/>
  <rect x="40" y="220" width="220" height="340" fill="url(#sidebar)"/>

  <rect x="64" y="72" width="120" height="12" rx="4" fill="#FFFFFF" opacity="0.95"/>

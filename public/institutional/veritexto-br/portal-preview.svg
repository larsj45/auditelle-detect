      <text x="778" y="349" fill="#15803D" font-weight="700" text-anchor="middle">4%</text>
      <rect x="838" y="336" width="50" height="18" rx="9" fill="#DCFCE7"/>
      <text x="863" y="349" fill="#15803D" font-weight="600" text-anchor="middle">pronto</text>

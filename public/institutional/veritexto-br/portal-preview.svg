      <rect x="298" y="468" width="110" height="8" rx="3" fill="#94A3B8"/>
      <rect x="440" y="460" width="90" height="10" rx="3" fill="#475569"/>
      <rect x="580" y="460" width="70" height="10" rx="3" fill="#475569"/>
      <rect x="700" y="456" width="36" height="18" rx="9" fill="#DCFCE7"/>
